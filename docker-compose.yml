services:

  # =========================================================
  # MYSQL
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: uajs-mysql

    networks:
      - smart-campus-network

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: uajs_smart_campus

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./uajs_smart_campus.sql:/docker-entrypoint-initdb.d/uajs_smart_campus.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================================================
  # ELASTICSEARCH
  # =========================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: uajs-elasticsearch

    networks:
      - smart-campus-network

    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10


  # =========================================================
  # SEARCH SERVICE
  # =========================================================
  search-service:
    build:
      context: ./services/search-service
      dockerfile: Dockerfile

    container_name: uajs-search-service

    networks:
      - smart-campus-network

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: uajs_smart_campus
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      SEARCH_SERVICE_PORT: 3011
      PORT: 3011

    expose:
      - "3011"

    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy


  # =========================================================
  # API GATEWAY
  # =========================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile

    container_name: uajs-gateway

    networks:
      - smart-campus-network

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: uajs_smart_campus
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # AUTH SERVICE
  # =========================================================
  auth-service:
    build:
      context: ./services/auth-service
