# =========================================================
# FRONTEND
# =========================================================
# El frontend vive ahora en su propio repositorio:
#   github.com/NatalyGil/UAJS-Smart-Campus-frontend
# Se ejecuta fuera de este compose con:  npm install && npm run dev
# (usa VITE_API_URL=http://localhost:3000 para apuntar a este gateway)
# =========================================================

# =========================================================
# REDES
# =========================================================
# Red compartida con los compose.yaml individuales de cada servicio.
# El nombre fijo evita el prefijo del proyecto y permite que esos
# archivos la declaren como external: true.
# =========================================================
networks:
  smart-campus-network:
    name: smart-campus-network

# =========================================================
# VOLUMES
# =========================================================
volumes:
  mysql_data:
  elasticsearch_data: