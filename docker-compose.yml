    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # REQUESTS SERVICE
  # =========================================================
  requests-service:
    build:
      context: ./services/requests-service
      dockerfile: Dockerfile

    container_name: uajs-requests-service
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: uajs_smart_campus
      PORT: 3006
      NOTIFICATIONS_WEBHOOK_URL: http://notifications-service:3005/api/notifications/webhook
      NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET:-uajs-dev-webhook-secret}

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # RESOURCES SERVICE
  # =========================================================
  resources-service:
    build:
      context: ./services/resources-service
      dockerfile: Dockerfile

    container_name: uajs-resources-service
    restart: unless-stopped

    env_file:
      - ./.env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: uajs_smart_campus
      PORT: 3007

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # FEEDBACK SERVICE
  # =========================================================
  feedback-service:
    build:
      context: ./services/feedback-service
      dockerfile: Dockerfile

    container_name: uajs-feedback-service
    restart: unless-stopped

