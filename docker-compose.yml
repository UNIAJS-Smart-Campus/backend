  # =========================================================
  # CONFIGURATION SERVICE
  # =========================================================
  configuration-service:
    build:
      context: ./services/configuration-service
      dockerfile: Dockerfile

    container_name: uajs-configuration-service
    restart: unless-stopped

    env_file:
