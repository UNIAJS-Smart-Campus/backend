services:
  requests-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uajs-requests-service
    restart: unless-stopped
    ports:
      - "${REQUESTS_SERVICE_PORT:-3006}:3006"
    environment:
      PORT: ${REQUESTS_SERVICE_PORT:-3006}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-uajs_smart_campus}
    env_file:
      - ../../../.env
    networks:
      - smart-campus-network

networks:
  smart-campus-network:
    name: smart-campus-network
    external: true
