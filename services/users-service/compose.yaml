services:
  users-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uajs-users-service
    restart: unless-stopped
    ports:
      - "${USERS_SERVICE_PORT:-3002}:3002"
    environment:
      PORT: ${USERS_SERVICE_PORT:-3002}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-uajs_smart_campus}
    env_file:
      - ../../../.env
    networks:
      - smart-campus-network

networks:
  smart-campus-network:
    name: smart-campus-network
    external: true