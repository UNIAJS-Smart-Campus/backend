services:
  info-academica-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uajs-info-academica-service
    restart: unless-stopped
    ports:
      - "${INFO_ACADEMICA_SERVICE_PORT:-3009}:3009"
    environment:
      PORT: ${INFO_ACADEMICA_SERVICE_PORT:-3009}
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-uajs_smart_campus}
    env_file:
      - ../../../.env
    networks:
      - smart-campus-network

networks:
  smart-campus-network:
    name: smart-campus-network
    external: true
