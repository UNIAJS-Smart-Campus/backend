services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uajs-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      PORT: ${GATEWAY_PORT:-3000}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3001}
      USERS_SERVICE_PORT: ${USERS_SERVICE_PORT:-3002}
      EVENTS_SERVICE_PORT: ${EVENTS_SERVICE_PORT:-3003}
      RESERVATIONS_SERVICE_PORT: ${RESERVATIONS_SERVICE_PORT:-3004}
      NOTIFICATIONS_SERVICE_PORT: ${NOTIFICATIONS_SERVICE_PORT:-3005}
      REQUESTS_SERVICE_PORT: ${REQUESTS_SERVICE_PORT:-3006}
      RESOURCES_SERVICE_PORT: ${RESOURCES_SERVICE_PORT:-3007}
      PQRS_SERVICE_PORT: ${PQRS_SERVICE_PORT:-3008}
      INFO_ACADEMICA_SERVICE_PORT: ${INFO_ACADEMICA_SERVICE_PORT:-3009}
      CONFIGURACION_SERVICE_PORT: ${CONFIGURACION_SERVICE_PORT:-3010}
    env_file:
      - ../../.env
    networks:
      - smart-campus-network

networks:
  smart-campus-network:
    name: smart-campus-network
    external: true